name: CafiPay CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  api-test:
    name: API tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cafipay
          POSTGRES_PASSWORD: cafipay
          POSTGRES_DB: cafipay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cafipay -d cafipay_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://cafipay:cafipay@localhost:5432/cafipay_test?schema=public
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      JWT_EXPIRES_IN: 1h
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:3000
      PORT: 4100
      FUNDING_PROVIDER_NAME: generic
      FUNDING_PROVIDER_URL: ''
      FUNDING_PROVIDER_API_KEY: ''
      FUNDING_WEBHOOK_SECRET: ci-webhook-secret
      FUNDING_CALLBACK_URL: http://localhost:3000/payment/callback

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create test database schema
        run: npx prisma db push --accept-data-loss

      - name: Run API test suite
        run: npm test
